Source: https://github.com/Vectricity/ontab -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OnTab</title>
  <link rel="icon" href="icons/icon-16.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header" id="popupHeader">
    <button class="header-button back-button" id="backButton" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <div class="header-title-group">
      <h2 id="headerTitle">OnTab</h2>
    </div>
    <button class="header-button settings-button" id="settingsButton" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19.2 13.2a7.6 7.6 0 0 0 0-2.4l2-1.6-2-3.4-2.5 1a8.3 8.3 0 0 0-2.1-1.2L14.2 3h-4.4l-.4 2.6a8.3 8.3 0 0 0-2.1 1.2l-2.5-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2.4l-2 1.6 2 3.4 2.5-1a8.3 8.3 0 0 0 2.1 1.2l.4 2.6h4.4l.4-2.6a8.3 8.3 0 0 0 2.1-1.2l2.5 1 2-3.4-2-1.6Z"/></svg>
    </button>
  </div>

  <div class="view" id="mainView">
    <section class="section">
      <div class="section-title"><span>Current Tab</span></div>
      <div class="item current-item" id="currentTabItem">
        <div class="item-info">
          <div class="item-title" id="currentTitle">Loading…</div>
          <div class="item-url" id="currentUrl">—</div>
        </div>
        <div class="item-actions" id="currentActions"></div>
      </div>
    </section>

    <section class="section suspended-section">
      <div class="section-title"><span>Suspended Tabs</span></div>
      <div class="list" id="suspendedList"></div>
    </section>
  </div>

  <div class="view settings-view" id="settingsView" hidden>
    <section class="settings-section" aria-labelledby="suspendedTabsSettingsTitle">
      <div class="section-title" id="suspendedTabsSettingsTitle"><span>Suspended Tabs</span></div>
      <div class="settings-controls">
        <label class="setting-row" for="iconSetting">
          <span>Icon</span>
          <select id="iconSetting">
            <option value="original">Original</option>
            <option value="ontab">OnTab</option>
          </select>
        </label>
        <label class="setting-row" for="titleSetting">
          <span>Title</span>
          <select id="titleSetting">
            <option value="original">Original</option>
            <option value="pause">Prefix (⏸)</option>
            <option value="ontab">Prefix (OnTab)</option>
          </select>
        </label>
      </div>
      <button class="restore-all-button" id="restoreAllButton" type="button">Restore All Tabs</button>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
